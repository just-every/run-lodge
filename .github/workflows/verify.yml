name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.reuse.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          WF_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          wf="${WF_REF%@*}"; wf="${wf##*/}"
          # Evidence is only a push run of this workflow from this repository, never this run: a pull request
          # tests its merge ref, a dispatch may run a subset, and a PR run of this workflow may itself be a skip.
          # Prints "<status> <conclusion>" of the newest such run on SHA $1, or nothing (any API error: nothing).
          newest_push() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$1&event=push&per_page=100" \
              --jq "[.workflow_runs[] | select(.head_repository.full_name == \"$GITHUB_REPOSITORY\" and .id != $GITHUB_RUN_ID)] | max_by(.id) | select(. != null) | \"\(.status) \(.conclusion)\"" || true
          }
          green() { [ "$(newest_push "$1")" = "completed success" ]; }
          skip=false
          # C1: main push of a SHA whose newest push run of this workflow (a branch run) is green.
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] && green "$GITHUB_SHA"; then skip=true; fi
          # C3 (exact): same tree as the parent, and the parent's newest push run is green (e.g. an empty commit).
          if [ "$skip" = false ] && [ "$EVENT" = push ] && parent=$(git rev-parse -q --verify HEAD~1) \
             && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD~1^{tree}')" ] && green "$parent"; then skip=true; fi
          # C2: same-repository PR. The lander takes any green same-repo run on the exact SHA as evidence,
          # pull_request runs included, so this run may pass without shards only when the push run on the
          # PR head is green: wait for it (at most 25 minutes).
          # No push run, any other result, or the wait running out: run in full.
          if [ "$EVENT" = pull_request ] && [ "$SAME_REPO" = true ]; then
            for _ in $(seq 1 50); do
              state=$(newest_push "$PR_HEAD")
              case "$state" in
                'completed success') skip=true; break ;;
                ''|completed\ *) break ;;
                *) sleep 30 ;;
              esac
            done
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
  # Build, site, types, emitted runtime, hosted output and hydration run once.
  # The Lodge matrix below supplies every HTTP/D1 test in the same workflow.
  rer-verify:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    env:
      LODGE_VERIFY_CORE: '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Ensure hosted-runner disk headroom
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: bash scripts/ci-space.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile && pnpm exec rer install
      - run: pnpm exec rer check --profile first-party
      # rer verify's hydration check launches the Chromium the seed's Playwright pins.
      - run: node scripts/ci-chromium.mjs
      - run: pnpm exec rer verify
  lodge:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        area: [candidates, offers, security, reports]
    env:
      LODGE_TEST_AREA: ${{ matrix.area }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:lodge
  browser:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        width: [1440, 390]
    env:
      LODGE_BROWSER_WIDTH: ${{ matrix.width }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Ensure hosted-runner disk headroom
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: bash scripts/ci-space.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile && pnpm exec rer install
      - run: node scripts/ci-chromium.mjs
      - run: node tests/browser.mjs
        env:
          LODGE_EVIDENCE: ${{ runner.temp }}/lodge-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lodge-browser-proof-${{ matrix.width }}
          path: ${{ runner.temp }}/lodge-proof
  surveys:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile && pnpm exec rer install
      - run: node scripts/ci-chromium.mjs
      - name: Survey response and privacy journeys at both widths
        run: timeout 1200 node tests/surveys-driver.mjs --browser
        env:
          LODGE_EVIDENCE: ${{ runner.temp }}/lodge-survey-proof
      - name: Survey workspace journey at both widths
        run: timeout 1200 node tests/clause-browser.mjs REPORT-004
        env:
          LODGE_EVIDENCE: ${{ runner.temp }}/lodge-survey-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lodge-survey-proof
          path: ${{ runner.temp }}/lodge-survey-proof

  verify:
    needs: [plan, rer-verify, lodge, browser, surveys]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require the plan and every shard
        env:
          PLAN: ${{ needs.plan.result }}
          SKIP: ${{ needs.plan.outputs.skip }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          test "$PLAN" = success
          if [ "$SKIP" = true ]; then exit 0; fi
          for result in $RESULTS; do test "$result" = success; done
